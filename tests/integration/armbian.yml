---
- name: Verify Armbian first-login onboarding
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    root_password: integration-root-secret
    user_password: integration-user-secret
  tasks:
    - name: Discover the default login and complete Armbian onboarding
      slawo.ssh_bootstrap.discover_credentials:
        host: 127.0.0.1
        port: 22223
        credential_profiles:
          - armbian
        onboarding:
          username: automation
          password: "{{ user_password }}"
          passwordless_sudo: true
        root:
          password: "{{ root_password }}"
        return_password: true
        host_key_checking: accept-new
        timeout: 5
      register: discovery
      no_log: true

    - name: Verify Armbian returned the created account
      ansible.builtin.assert:
        that:
          - discovery.changed
          - discovery.attempts == 4
          - discovery.credentials.username == 'automation'
          - discovery.credentials.password == user_password
          - discovery.credentials.uid | int > 0
          - not discovery.credentials.is_root
          - discovery.become.enabled
          - discovery.become.method == 'sudo'
          - discovery.become.user == 'root'
      no_log: true

    - name: Verify the changed root password can log in
      slawo.ssh_bootstrap.discover_credentials:
        host: 127.0.0.1
        port: 22223
        credentials:
          - username: root
            password: "{{ root_password }}"
        host_key_checking: accept-new
        timeout: 5
      register: root_login
      no_log: true

    - name: Verify root login result
      ansible.builtin.assert:
        that:
          - not root_login.changed
          - root_login.credentials.username == 'root'
          - root_login.credentials.password == root_password
      no_log: true

    - name: Verify the created user and its different password can log in
      slawo.ssh_bootstrap.discover_credentials:
        host: 127.0.0.1
        port: 22223
        credentials:
          - username: automation
            password: "{{ user_password }}"
        host_key_checking: accept-new
        timeout: 5
      register: user_login
      no_log: true

    - name: Verify created-user login result
      ansible.builtin.assert:
        that:
          - not user_login.changed
          - user_login.credentials.username == 'automation'
          - user_login.credentials.password == user_password
      no_log: true

    - name: Read the created user's groups from the fixture
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - ssh-bootstrap-armbian
          - id
          - --name
          - --groups
          - automation
      register: user_groups
      changed_when: false

    - name: Verify the created user has sudo access
      ansible.builtin.assert:
        that:
          - "'sudo' in user_groups.stdout.split()"
