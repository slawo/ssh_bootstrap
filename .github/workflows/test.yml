---
name: test

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  collection:
    name: ansible-core ${{ matrix.ansible_core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible_core:
          - "2.18.*"
          - "2.19.*"
          - "2.20.*"
          - "2.21.*"
        python:
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: >-
          python -m pip install
          "ansible-core==${{ matrix.ansible_core }}"
          ansible-lint
          pexpect

      - name: Compile Python sources
        run: python -m compileall -q plugins tests

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -v

      - name: Lint collection
        run: ansible-lint .

      - name: Build collection
        run: ansible-galaxy collection build --output-path dist --force
