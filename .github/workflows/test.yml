---
name: test

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  collection:
    name: ansible-core ${{ matrix.ansible_core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible_core:
          - "2.18.*"
          - "2.19.*"
          - "2.20.*"
          - "2.21.*"
        python:
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: >-
          python -m pip install
          "ansible-core==${{ matrix.ansible_core }}"
          ansible-lint
          pexpect

      - name: Compile Python sources
        run: python -m compileall -q plugins tests

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -v

      - name: Lint collection
        run: ansible-lint .

      - name: Build collection
        run: ansible-galaxy collection build --output-path dist --force

  integration:
    name: SSH integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "ansible-core~=2.21.0" pexpect

      - name: Build and install collection artifact
        run: |
          ansible-galaxy collection build --output-path dist --force
          ansible-galaxy collection install \
            --collections-path "${RUNNER_TEMP}/collections" \
            --force \
            dist/slawo-ssh_bootstrap-*.tar.gz

      - name: Build SSH fixtures
        run: |
          docker build --tag ssh-bootstrap-basic tests/integration/fixtures/sshd
          docker build --tag ssh-bootstrap-armbian tests/integration/fixtures/armbian
          docker build --tag ssh-bootstrap-ubuntu tests/integration/fixtures/ubuntu

      - name: Start SSH fixtures
        run: |
          docker run --detach --name ssh-bootstrap-basic --publish 22222:22 ssh-bootstrap-basic
          docker run --detach --name ssh-bootstrap-armbian --publish 22223:22 ssh-bootstrap-armbian
          docker run --detach --name ssh-bootstrap-ubuntu --publish 22224:22 ssh-bootstrap-ubuntu

      - name: Wait for SSH fixtures
        run: |
          for port in 22222 22223 22224; do
            ready=false
            for attempt in $(seq 1 30); do
              if ssh-keyscan -p "${port}" 127.0.0.1 >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "${ready}" != true ]; then
              echo "SSH fixture on port ${port} did not become ready"
              exit 1
            fi
          done

      - name: Run SSH integration tests
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
        run: |
          ansible-playbook tests/integration/happy_path.yml
          ansible-playbook tests/integration/armbian.yml
          ansible-playbook tests/integration/ubuntu.yml

      - name: Show SSH fixture logs after failure
        if: failure()
        run: |
          docker logs ssh-bootstrap-basic || true
          docker logs ssh-bootstrap-armbian || true
          docker logs ssh-bootstrap-ubuntu || true

      - name: Remove SSH fixtures
        if: always()
        run: |
          docker rm --force ssh-bootstrap-basic || true
          docker rm --force ssh-bootstrap-armbian || true
          docker rm --force ssh-bootstrap-ubuntu || true
