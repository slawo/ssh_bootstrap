---
name: test

on:
  pull_request:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  collection:
    name: ansible-core ${{ matrix.ansible_core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible_core:
          - "2.18.*"
          - "2.19.*"
          - "2.20.*"
          - "2.21.*"
        python:
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: >-
          python -m pip install
          "ansible-core==${{ matrix.ansible_core }}"
          ansible-lint
          pexpect

      - name: Compile Python sources
        run: python -m compileall -q plugins tests

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -v

      - name: Lint collection
        run: ansible-lint .

      - name: Build collection
        run: ansible-galaxy collection build --output-path dist --force

  integration:
    name: SSH integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "ansible-core~=2.21.0" pexpect

      - name: Build and install collection artifact
        run: |
          ansible-galaxy collection build --output-path dist --force
          ansible-galaxy collection install \
            --collections-path "${RUNNER_TEMP}/collections" \
            --force \
            dist/slawo-ssh_bootstrap-*.tar.gz

      - name: Build SSH fixtures
        run: |
          docker build --tag ssh-bootstrap-basic tests/integration/fixtures/sshd
          docker build --tag ssh-bootstrap-armbian tests/integration/fixtures/armbian
          docker build --tag ssh-bootstrap-ubuntu tests/integration/fixtures/ubuntu

      - name: Start SSH fixtures
        run: |
          docker run --detach --name ssh-bootstrap-basic --publish 22222:22 ssh-bootstrap-basic
          docker run --detach --name ssh-bootstrap-armbian --publish 22223:22 ssh-bootstrap-armbian
          docker run --detach --name ssh-bootstrap-ubuntu --publish 22224:22 ssh-bootstrap-ubuntu

      - name: Wait for SSH fixtures
        run: |
          for port in 22222 22223 22224; do
            ready=false
            for attempt in $(seq 1 30); do
              if ssh-keyscan -p "${port}" 127.0.0.1 >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "${ready}" != true ]; then
              echo "SSH fixture on port ${port} did not become ready"
              exit 1
            fi
          done

      - name: Run happy path integration test
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
        run: |
          set +e
          ansible-playbook tests/integration/happy_path.yml 2>&1 | tee "${RUNNER_TEMP}/happy-path.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            message=$(tail -n 80 "${RUNNER_TEMP}/happy-path.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=SSH happy path failed::${message}"
            exit "${status}"
          fi

      - name: Run remaining SSH integration tests
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
        run: |
          ansible-playbook tests/integration/armbian.yml
          ansible-playbook tests/integration/ubuntu.yml

      - name: Show SSH fixture logs after failure
        if: failure()
        run: |
          docker logs ssh-bootstrap-basic || true
          docker logs ssh-bootstrap-armbian || true
          docker logs ssh-bootstrap-ubuntu || true

      - name: Remove SSH fixtures
        if: always()
        run: |
          docker rm --force ssh-bootstrap-basic || true
          docker rm --force ssh-bootstrap-armbian || true
          docker rm --force ssh-bootstrap-ubuntu || true

  platform-integration:
    name: SSH target / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 LTS
            image: ubuntu:22.04
            dockerfile: Dockerfile.apt
          - name: Ubuntu 24.04 LTS
            image: ubuntu:24.04
            dockerfile: Dockerfile.apt
          - name: Ubuntu 26.04 LTS
            image: ubuntu:26.04
            dockerfile: Dockerfile.apt
          - name: Debian 12 LTS
            image: debian:12
            dockerfile: Dockerfile.apt
          - name: Debian 13
            image: debian:13
            dockerfile: Dockerfile.apt
          - name: Fedora 44
            image: fedora:44
            dockerfile: Dockerfile.fedora
          - name: Arch rolling
            image: archlinux:latest
            dockerfile: Dockerfile.arch

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "ansible-core~=2.21.0" pexpect

      - name: Build and install collection artifact
        run: |
          ansible-galaxy collection build --output-path dist --force
          ansible-galaxy collection install \
            --collections-path "${RUNNER_TEMP}/collections" \
            --force \
            dist/slawo-ssh_bootstrap-*.tar.gz

      - name: Build ${{ matrix.name }} SSH fixture
        run: >-
          docker build
          --build-arg BASE_IMAGE=${{ matrix.image }}
          --file tests/integration/fixtures/platforms/${{ matrix.dockerfile }}
          --tag ssh-bootstrap-platform
          tests/integration/fixtures/platforms

      - name: Start ${{ matrix.name }} SSH fixture
        run: >-
          docker run --detach --name ssh-bootstrap-platform
          --publish 22225:22 ssh-bootstrap-platform

      - name: Wait for the SSH fixture
        run: |
          for attempt in $(seq 1 30); do
            if ssh-keyscan -p 22225 127.0.0.1 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs ssh-bootstrap-platform
          exit 1

      - name: Run platform integration test
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
        run: ansible-playbook tests/integration/platform.yml

      - name: Show SSH fixture logs after failure
        if: failure()
        run: docker logs ssh-bootstrap-platform

      - name: Remove SSH fixture
        if: always()
        run: docker rm --force ssh-bootstrap-platform

  openbsd-integration:
    name: SSH target / OpenBSD 7.9
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test in an OpenBSD VM
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          release: "7.9"
          copyback: false
          prepare: |
            export PATH=/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/bin
            /usr/sbin/pkg_add ansible-core py3-pexpect
            /usr/sbin/useradd -o -u 0 -m -s /bin/ksh -p "$(/usr/bin/encrypt integration-secret)" bootstrap
            /usr/sbin/sshd -f tests/integration/fixtures/openbsd/sshd_config
          run: |
            export PATH=/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/bin
            /usr/local/bin/ansible-galaxy collection build --output-path dist --force
            /usr/local/bin/ansible-galaxy collection install --force dist/slawo-ssh_bootstrap-*.tar.gz
            /usr/local/bin/ansible-playbook tests/integration/platform.yml -e expect_root=true
