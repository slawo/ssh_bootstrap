---
name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release-please:
    needs:
      - test
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-please.yml

  release-artifacts:
    needs:
      - release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-artifacts.yml
    with:
      release_sha: ${{ needs.release-please.outputs.sha }}
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
