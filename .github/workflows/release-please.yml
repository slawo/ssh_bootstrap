---
name: release-please

on:
  workflow_call:
    outputs:
      release_created:
        description: Whether a GitHub release was created
        value: ${{ jobs.release-please.outputs.release_created }}
      sha:
        description: Commit SHA tagged by the release
        value: ${{ jobs.release-please.outputs.sha }}
      tag_name:
        description: Created release tag
        value: ${{ jobs.release-please.outputs.tag_name }}
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'slawo/ansible-ssh-bootstrap'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
